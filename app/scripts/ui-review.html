<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>The External Brain demo review</title></head>
<body><div id="app"></div><script type="module">
// Development-only fixture; Vite's production entry does not include this page.
import React from 'react';
import { createRoot } from 'react-dom/client';
import App from '/src/App.tsx';
import WorkspaceLoader from '/src/WorkspaceLoader.tsx';
import { seed } from '/src/model.ts';
import { demoAction } from '/src/demo.ts';
import '/src/style.css';
import '/src/studio.css';
import '/src/visual-update.css';
const query = new URLSearchParams(location.search);
localStorage.setItem('openlabs-theme', query.get('theme') || 'dark');
function Review() {
  const [data, setData] = React.useState(() => {
    const copy = structuredClone(seed);
    if (query.has('catalogEdge')) copy.initiatives.push({ ...copy.initiatives[0], id: 'inactive-fixture', title: 'Withheld fixture', category: 'Withheld discipline', status: 'paused' });
    return copy;
  });
  const [userId, setUserId] = React.useState(query.get('user') || null);
  return React.createElement(App, { data, userId, mode: query.has('live') ? 'live' : 'demo', authEmail: null,
    onAction: async (name, payload) => {
      if (name === 'switchDemoUser') setUserId(payload.userId || null);
      else setData(await demoAction(data, userId, name, payload));
    }, onSignIn: async () => {}, onVerifyCode: async () => {}, onVerifyLink: async () => { window.__verifyLinkCalls = (window.__verifyLinkCalls || 0) + 1 }, onSignOut: async () => setUserId(null) });
}
createRoot(document.getElementById('app')).render(React.createElement(query.has('loader') ? WorkspaceLoader : Review));
</script></body></html>
