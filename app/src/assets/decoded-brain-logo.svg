<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Perfectly Mirrored Vertical Spectrum: Cyan Top -> Royal Blue Mid -> Crimson Bottom -->
    <linearGradient id="hemiMirrorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="30%" stop-color="#00D2FF"/>
      <stop offset="60%" stop-color="#1259F3"/>
      <stop offset="100%" stop-color="#FF2A55"/>
    </linearGradient>

    <radialGradient id="softApertureAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1259F3" stop-opacity="0.32"/>
      <stop offset="60%" stop-color="#00E5FF" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#0A0E18" stop-opacity="0"/>
    </radialGradient>

    <filter id="crispOutlineGlowV2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Obsidian Studio Frame -->
  <rect width="512" height="512" rx="108" fill="#0A0E18"/>

  <!-- Ambient Light Centered on Brain Mark -->
  <circle cx="256" cy="256" r="185" fill="url(#softApertureAura)"/>

  <!-- Subtle Coordinate Reticle -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#1259F3" stroke-opacity="0.14" stroke-width="1.2"/>
  <ellipse cx="256" cy="256" rx="190" ry="120" fill="none" stroke="#1259F3" stroke-opacity="0.08" stroke-width="1" stroke-dasharray="3 6"/>

  <!-- ANATOMICAL BRAIN SILHOUETTE WITH DETAILED GYRI & SULCAL ARCHITECTURE (Centered vertically without text) -->
  <!-- Left Hemisphere (Anatomical Lobes: Frontal, Precentral Gyrus, Temporal Pole, Occipital Pole, Cerebellar Notch) -->
  <path d="M 248 114
           C 214 114, 180 122, 154 142
           C 134 158, 126 180, 128 204
           C 130 218, 120 230, 116 244
           C 112 260, 116 276, 126 288
           C 134 298, 134 310, 128 322
           C 120 338, 126 358, 142 370
           C 160 384, 186 386, 206 378
           C 224 370, 238 354, 244 336
           C 248 324, 248 280, 248 246
           L 248 114 Z"
        fill="none" stroke="url(#hemiMirrorGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" filter="url(#crispOutlineGlowV2)"/>

  <!-- Left Deep Cortical Fissures (Sylvian Fissure & Central Sulcus curves) -->
  <path d="M 128 204 C 158 206, 186 226, 218 220" fill="none" stroke="url(#hemiMirrorGrad)" stroke-width="3.5" stroke-linecap="round" opacity="0.85"/>
  <path d="M 126 288 C 160 278, 186 298, 224 288" fill="none" stroke="url(#hemiMirrorGrad)" stroke-width="3.5" stroke-linecap="round" opacity="0.85"/>
  <path d="M 154 142 C 176 160, 208 162, 236 160" fill="none" stroke="url(#hemiMirrorGrad)" stroke-width="2.2" stroke-linecap="round" opacity="0.6"/>

  <!-- Right Hemisphere (Exact Mirrored Geometry & Horizontal Color Symmetry) -->
  <path d="M 264 114
           C 298 114, 332 122, 358 142
           C 378 158, 386 180, 384 204
           C 382 218, 392 230, 396 244
           C 400 260, 396 276, 386 288
           C 378 298, 378 310, 384 322
           C 392 338, 386 358, 370 370
           C 352 384, 326 386, 306 378
           C 288 370, 274 354, 268 336
           C 264 324, 264 280, 264 246
           L 264 114 Z"
        fill="none" stroke="url(#hemiMirrorGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" filter="url(#crispOutlineGlowV2)"/>

  <!-- Right Deep Cortical Fissures -->
  <path d="M 384 204 C 354 206, 326 226, 294 220" fill="none" stroke="url(#hemiMirrorGrad)" stroke-width="3.5" stroke-linecap="round" opacity="0.85"/>
  <path d="M 386 288 C 352 278, 326 298, 288 288" fill="none" stroke="url(#hemiMirrorGrad)" stroke-width="3.5" stroke-linecap="round" opacity="0.85"/>
  <path d="M 358 142 C 336 160, 304 162, 276 160" fill="none" stroke="url(#hemiMirrorGrad)" stroke-width="2.2" stroke-linecap="round" opacity="0.6"/>

  <!-- Inter-Hemispheric Fissure & Neural Convergence Core -->
  <line x1="256" y1="130" x2="256" y2="350" stroke="#00E5FF" stroke-width="2.5" stroke-dasharray="4 6" opacity="0.75"/>
  <circle cx="256" cy="246" r="14" fill="#0A0E18" stroke="#1259F3" stroke-width="2.5" filter="url(#crispOutlineGlowV2)"/>
  <circle cx="256" cy="246" r="5" fill="#00E5FF"/>

  <!-- Horizontally Symmetrical Electrodes at Key 10-20 Anatomical Landmarks -->
  <!-- Fp1 / Fp2 (Frontal Poles - Cyan) -->
  <circle cx="154" cy="142" r="5.5" fill="#00E5FF" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="358" cy="142" r="5.5" fill="#00E5FF" stroke="#FFFFFF" stroke-width="2"/>

  <!-- T3 / T4 (Temporal Poles - Studio Blue) -->
  <circle cx="116" cy="244" r="5.5" fill="#1259F3" stroke="#00E5FF" stroke-width="2"/>
  <circle cx="396" cy="244" r="5.5" fill="#1259F3" stroke="#00E5FF" stroke-width="2"/>

  <!-- O1 / O2 (Occipital / Cerebellar - Electric Crimson) -->
  <circle cx="160" cy="370" r="5.5" fill="#FF2A55" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="352" cy="370" r="5.5" fill="#FF2A55" stroke="#FFFFFF" stroke-width="2"/>
</svg>