<svg xmlns="http://www.w3.org/2000/svg" class="w-full h-full relative z-10 overflow-visible" fill="none" viewBox="0 0 640 480">
<style>


    /* Organic Dash Stroke Travel for Neural Branch Propagation */
    @keyframes travelFast {
      0% {
        stroke-dashoffset: 400;
        opacity: 0.15;
      }
      20% {
        opacity: 1;
      }
      80% {
        opacity: 0.95;
      }
      100% {
        stroke-dashoffset: 0;
        opacity: 0.2;
      }
    }

    @keyframes travelMedium {
      0% {
        stroke-dashoffset: 550;
        opacity: 0.1;
      }
      30% {
        opacity: 1;
      }
      85% {
        opacity: 0.9;
      }
      100% {
        stroke-dashoffset: 0;
        opacity: 0.15;
      }
    }

    @keyframes travelSlow {
      0% {
        stroke-dashoffset: 700;
        opacity: 0.1;
      }
      40% {
        opacity: 1;
      }
      90% {
        opacity: 0.85;
      }
      100% {
        stroke-dashoffset: 0;
        opacity: 0.1;
      }
    }

    /* Organic Outward Growth Pulse */
    @keyframes branchPulse {
      0%, 100% {
        filter: drop-shadow(0 0 4px rgba(245, 158, 11, 0.6)) drop-shadow(0 0 10px rgba(239, 68, 68, 0.4));
      }
      50% {
        filter: drop-shadow(0 0 8px rgba(251, 113, 133, 0.9)) drop-shadow(0 0 18px rgba(245, 158, 11, 0.7));
      }
    }

    /* Soma Core Respiration */
    @keyframes somaBreathing {
      0%, 100% {
        transform: scale(0.96);
        filter: drop-shadow(0 0 12px rgba(245, 158, 11, 0.85)) drop-shadow(0 0 24px rgba(239, 68, 68, 0.6));
      }
      50% {
        transform: scale(1.1);
        filter: drop-shadow(0 0 22px rgba(253, 224, 71, 0.95)) drop-shadow(0 0 38px rgba(251, 113, 133, 0.85));
      }
    }

    /* Terminal Synaptic Bouton Sparks */
    @keyframes boutonBlink {
      0%, 100% {
        opacity: 0.35;
        transform: scale(0.85);
      }
      50% {
        opacity: 1;
        transform: scale(1.35);
      }
    }

    /* Gradient Progress Bar Shimmer */
    @keyframes progressSweep {
      0% {
        background-position: -200% 0;
      }
      100% {
        background-position: 200% 0;
      }
    }

    .fire-apical {
      stroke-dasharray: 180 300;
      animation: travelFast 2.8s cubic-bezier(0.25, 0.1, 0.25, 1) infinite;
    }

    .fire-lateral {
      stroke-dasharray: 220 340;
      animation: travelMedium 3.6s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      animation-delay: 0.45s;
    }

    .fire-basal {
      stroke-dasharray: 140 260;
      animation: travelSlow 3.2s ease-in-out infinite;
      animation-delay: 0.8s;
    }

    .fire-fast-spur {
      stroke-dasharray: 90 200;
      animation: travelFast 2.2s linear infinite;
      animation-delay: 0.2s;
    }

    .soma-element {
      transform-origin: 320px 305px;
      animation: somaBreathing 2.4s ease-in-out infinite;
    }

    .bouton-spark {
      animation: boutonBlink 1.8s ease-in-out infinite alternate;
    }

    .tree-glow-wrap {
      animation: branchPulse 4.5s ease-in-out infinite;
    }

    .progress-bar-shimmer {
      background-size: 200% 100%;
      animation: progressSweep 2.8s linear infinite;
    }

@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs><!-- Bioluminescent Glow Filter -->
<filter height="200%" id="neuralGlow" width="200%" x="-50%" y="-50%">
<feGaussianBlur in="SourceGraphic" result="blur1" stdDeviation="3.5"></feGaussianBlur>
<feGaussianBlur in="SourceGraphic" result="blur2" stdDeviation="8"></feGaussianBlur>
<feMerge>
<feMergeNode in="blur2"></feMergeNode>
<feMergeNode in="blur1"></feMergeNode>
<feMergeNode in="SourceGraphic"></feMergeNode>
</feMerge>
</filter>
<!-- Intense Soma Core Glow -->
<filter height="220%" id="coreGlow" width="220%" x="-60%" y="-60%">
<feGaussianBlur in="SourceGraphic" result="blur" stdDeviation="6"></feGaussianBlur>
<feMerge>
<feMergeNode in="blur"></feMergeNode>
<feMergeNode in="SourceGraphic"></feMergeNode>
</feMerge>
</filter>
<!-- Vivid Pink to Deep Crimson & Electric Cyan Accents for Left Trunks -->
<linearGradient id="gradAmberToPinkL" x1="100%" x2="0%" y1="100%" y2="0%">
<stop offset="0%" stop-color="#FDA4AF"></stop>
<stop offset="25%" stop-color="#FB7185"></stop>
<stop offset="55%" stop-color="#F43F5E"></stop>
<stop offset="85%" stop-color="#EF4444"></stop>
<stop offset="100%" stop-color="#00daf3"></stop>
