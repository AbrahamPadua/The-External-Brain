<linearGradient id="gradApical" x1="50%" x2="50%" y1="100%" y2="0%">
<stop offset="0%" stop-color="#FDA4AF"></stop>
<stop offset="25%" stop-color="#FB7185"></stop>
<stop offset="60%" stop-color="#F43F5E"></stop>
<stop offset="85%" stop-color="#E11D48"></stop>
<stop offset="100%" stop-color="#BE123C"></stop>
